apiVersion: infrastructure.edgecdnx.com/v1alpha1
kind: DNSEndpoint
metadata:
  name: test1-edgecdnx-com
spec:
  project:
    name: tenant-demo
  zone:
    name: edgecdnx-com
  dnsName: test1.edgecdnx.com
  routingPolicy: Geolocation
  recordTTL: 10
  recordType: A
  routeSelector:
    matchLabels:
      edgecdnx.com/routing-instance: edgecdnx
---
apiVersion: infrastructure.edgecdnx.com/v1alpha1
kind: DNSEndpoint
metadata:
  name: test1-example-com
spec:
  project:
    name: tenant-demo
  zone:
    name: example-com
  dnsName: test1.example.com
  routingPolicy: Geolocation
  recordTTL: 10
  recordType: A
  routeSelector:
    matchLabels:
      edgecdnx.com/routing-instance: edgecdnx
